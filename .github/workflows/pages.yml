# Type-check, test and build PRECOG, then publish dist/ to GitHub Pages.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Refresh the GDELT snapshot (data/gdelt.json) every 6 hours.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and format check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build single-file dashboard
        run: npm run build
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
      - name: GDELT snapshot (shared cache, so browsers don't hit GDELT's rate limit)
        if: github.event_name != 'pull_request'
        run: node scripts/gdelt-snapshot.ts dist/data/gdelt.json
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/data/gdelt.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
